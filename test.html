<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת חיבור לגארמין</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f3f5f8; color: #111827; margin: 0; padding: 24px 16px; }
  main { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #e1e5ec; border-radius: 10px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.4rem; margin: 0; }
  p { margin: 0; color: #485162; line-height: 1.5; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: #485162; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #c9cfd9; border-radius: 7px; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 0; background: #2a78d6; color: #fff; cursor: pointer; align-self: flex-start; }
  button:disabled { opacity: .6; cursor: progress; }
  pre { background: #111827; color: #e5e7eb; padding: 12px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: .85rem; min-height: 3em; margin: 0; direction: ltr; text-align: left; }
  .ok { color: #3fbf6f; } .bad { color: #ef6b63; }
</style>
</head>
<body>
<main>
  <h1>בדיקת חיבור לגארמין</h1>
  <p>הדף בודק אם אפשר לקבל אסימון גישה מגארמין ולקרוא נתונים ישירות מהדפדפן. המפתח נשלח רק לגארמין ולא נשמר בשום מקום. האסימון שמתקבל לא מוצג במסך, כך שבטוח לצלם את התוצאה.</p>
  <label for="tokenUrl">כתובת Obtain Token (מהתיעוד של גארמין)
    <input id="tokenUrl" dir="ltr" value="https://personal.connectapi.garmin.com/personalapitoken-service/personal-api/personal-api-key/token">
  </label>
  <label for="apiKey">מפתח ה־API שלך
    <input id="apiKey" type="password" dir="ltr" autocomplete="off">
  </label>
  <button id="run" type="button">הרץ בדיקה</button>
  <pre id="out">התוצאות יופיעו כאן.</pre>
</main>
<script>
const out = document.getElementById('out');
const log = (text, cls) => { const s = document.createElement('div'); if (cls) s.className = cls; s.textContent = text; out.appendChild(s); };
const hide = t => t.replace(/("[A-Za-z_]*token[A-Za-z_]*"\s*:\s*")[^"]+"/gi, '$1<hidden>"');

document.getElementById('run').onclick = async () => {
  const btn = document.getElementById('run'); btn.disabled = true; out.textContent = '';
  const url = document.getElementById('tokenUrl').value.trim();
  const key = document.getElementById('apiKey').value.trim();
  log('origin: ' + location.origin);
  try {
    // Step 1: API key -> access token
    let token = null;
    try {
      const r = await fetch(url, { method: 'POST', headers: { Authorization: 'ApiKey ' + key } });
      const text = await r.text();
      log('STEP 1 (token) STATUS ' + r.status, r.ok ? 'ok' : 'bad');
      log(hide(text).slice(0, 500));
      try {
        const j = JSON.parse(text);
        const k = Object.keys(j).find(n => /access.?token/i.test(n)) || Object.keys(j).find(n => /token/i.test(n));
        token = k ? j[k] : null;
        log('fields: ' + Object.keys(j).join(', '));
      } catch { /* not json */ }
    } catch (e) { log('STEP 1 BLOCKED: ' + e.message, 'bad'); return; }
    if (!token) { log('לא התקבל אסימון, הבדיקה נעצרה.', 'bad'); return; }

    // Step 2: token -> a harmless data call (list of activity types, no personal data)
    const api = 'https://personal.connectapi.garmin.com/activity-service/activity/activityTypes/simple';
    try {
      const r2 = await fetch(api, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
      const t2 = await r2.text();
      log('STEP 2 (activityTypes) STATUS ' + r2.status, r2.ok ? 'ok' : 'bad');
      log(t2.slice(0, 300));
    } catch (e) { log('STEP 2 BLOCKED: ' + e.message, 'bad'); }
  } finally { btn.disabled = false; }
};
</script>
</body>
</html>
